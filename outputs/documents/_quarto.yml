project:
  type: book
  pre-render:
    - "python3 scripts/build_index_from_manuscript.py"
  post-render:
    - "python3 scripts/patch_appendix_docx.py"
  
book:
  title: "Micronutrient Supplementation for Depressive and Anxiety Symptoms in Adults: A Systematic Review and Bayesian Network Meta-Analysis of Randomized Controlled Trials"
  chapters:
    - index.qmd
    - Appendix.qmd

csl: https://www.zotero.org/styles/nlm
  
format:
  html:
    toc: true
    toc-depth: 3
    number-sections: true
    html-math-method: katex
    include-after-body: appendix-numbering.html
  docx:
    toc: true
    toc-depth: 3
    number-sections: true
    reference-doc: reference/custom-reference.docx
execute:
  echo: false
  
tbl-cap-location: bottom
filters:
  - appendix.lua
  - filters/appendix-boundary.lua
